<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/form.css">
    <title>Doctor Appointment Form</title>
</head>
<body>
    <main>
        <h1>Doctor Appointment Form</h1>
        <form action="">
            <label for="appointment_date">Appointment Date</label>
            <input type="date" name="appointment_date"><br><br>

            <label for="appointment_time">Appointment Time</label>
            <input type="time" name="appointment_time"><br><br>

            <label>Name</label>
            <input type="text" name="first_name" placeholder="First">
            <input type="text" name="last_name" placeholder="Last"><br><br>

            <label>Gender</label>
            <label><input type="radio" name="gender" value="male"> Male</label>
            <label><input type="radio" name="gender" value="female" checked> Female</label><br><br>

            <label for="phone">Phone</label>
            <input type="text" id="phone" name="phone" placeholder="####"><br><br>

            <label>Address</label>
            <input type="text" name="city" placeholder="city">
            <input type="text" name="state" placeholder="state"><br><br>

            <div class="query">
                <label for="query">Your Query</label>
                <textarea name="query" rows="4" cols="50"></textarea><br><br>
            </div>

            <label>Appointment Type</label>
            <p>Select which appointment type(s) you require</p>
            <label><input type="checkbox" name="appointment_type" value="cervix" checked> Cervix checkup</label><br>
            <label><input type="checkbox" name="appointment_type" value="heart" checked> Heart checkup</label><br>
            <label><input type="checkbox" name="appointment_type" value="eye"> Eye check-up</label><br>
            <label><input type="checkbox" name="appointment_type" value="hearing"> Hearing Test</label><br><br>

            <button type="submit">Send</button>
        </form>
    </main>
</body>
</html>
